<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新幹線ライブマップ | 東海道・山陽・九州新幹線</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<style>
  :root{
    --bg: #0B1220;
    --panel: #121A2B;
    --panel-2: #17223A;
    --line: rgba(255,255,255,0.08);
    --text: #E8ECF4;
    --text-muted: #8A94A6;
    --accent: #3B6BFF;
    --accent-dim: #1E4FD9;
    --live: #FFB020;
    --stopped: #4A5568;
  }

  *{ box-sizing: border-box; margin:0; padding:0; }

  html, body{
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: "Zen Kaku Gothic New", sans-serif;
    overflow: hidden;
  }

  .app{
    display: grid;
    grid-template-columns: 360px 1fr;
    height: 100vh;
  }

  /* ---------- サイドパネル ---------- */
  .panel{
    background: var(--panel);
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .panel-header{
    padding: 28px 24px 20px;
    border-bottom: 1px solid var(--line);
  }

  .eyebrow{
    font-family: "JetBrains Mono", monospace;
    font-size: 11px;
    letter-spacing: 0.12em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .panel-header h1{
    font-size: 22px;
    font-weight: 900;
    letter-spacing: 0.02em;
  }

  .panel-header .sub{
    margin-top: 6px;
    font-size: 12.5px;
    color: var(--text-muted);
  }

  .status-row{
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 24px;
    border-bottom: 1px solid var(--line);
    font-family: "JetBrains Mono", monospace;
    font-size: 12px;
    color: var(--text-muted);
  }

  .status-row .clock{
    color: var(--text);
    font-weight: 700;
    font-size: 14px;
  }

  .train-list{
    flex: 1;
    overflow-y: auto;
    padding: 8px 0;
  }

  .train-list::-webkit-scrollbar{ width: 6px; }
  .train-list::-webkit-scrollbar-thumb{ background: var(--panel-2); border-radius: 3px; }

  .train-card{
    padding: 14px 24px;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .train-card:hover{ background: var(--panel-2); }
  .train-card.active{ background: var(--panel-2); border-left: 3px solid var(--accent); }
  .train-card.special{ background: linear-gradient(90deg, rgba(255,215,0,0.08), transparent); }

  .special-badge{
    font-family: "Zen Kaku Gothic New", sans-serif;
    font-size: 10px;
    color: #FFD700;
    background: rgba(255,215,0,0.15);
    padding: 1px 6px;
    border-radius: 8px;
    margin-left: 4px;
  }

  .train-card-top{
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }

  .train-number{
    font-family: "JetBrains Mono", monospace;
    font-weight: 700;
    font-size: 14px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .type-dot{
    display: inline-block;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .badge{
    font-family: "JetBrains Mono", monospace;
    font-size: 10px;
    letter-spacing: 0.06em;
    padding: 2px 8px;
    border-radius: 10px;
    text-transform: uppercase;
  }
  .badge.running{ background: rgba(255,176,32,0.15); color: var(--live); }
  .badge.stopped{ background: rgba(74,85,104,0.3); color: var(--text-muted); }

  .train-segment{
    font-size: 12.5px;
    color: var(--text-muted);
  }

  .empty-state{
    padding: 40px 24px;
    text-align: center;
    color: var(--text-muted);
    font-size: 13px;
    line-height: 1.7;
  }

  .panel-footer{
    padding: 14px 24px;
    border-top: 1px solid var(--line);
    font-size: 11px;
    color: var(--text-muted);
    line-height: 1.6;
  }

  /* ---------- マップ ---------- */
  .map-wrap{
    position: relative;
    height: 100vh;
    width: 100%;
  }

  #map{
    height: 100%;
    width: 100%;
    background: #EDEBE6;
  }

  .leaflet-container{
    background: #EDEBE6 !important;
  }

  .station-dot{
    background: var(--text-muted);
    border-radius: 50%;
    opacity: 0.8;
  }
  .station-dot.major{
    background: var(--text);
  }

  .station-label{
    font-family: "Zen Kaku Gothic New", sans-serif;
    font-size: 11px;
    font-weight: 500;
    color: var(--text);
    white-space: nowrap;
    background: rgba(11,18,32,0.85) !important;
    border: none !important;
    box-shadow: none !important;
    padding: 1px 6px !important;
    border-radius: 3px;
  }
  .leaflet-tooltip.station-label::before{
    display: none; /* leafletデフォルトの吹き出し矢印を消す */
  }

  /* 新幹線アイコン */
  .leaflet-div-icon.shinkansen-icon{
    background: transparent !important;
    border: none !important;
  }
  .shinkansen-icon{
    /* position は指定しない: Leafletが要求する position:absolute を
       上書きしてしまうと、マーカーの座標変換が壊れて位置がズレるため */
    width: 34px;
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 1.2s linear; /* 位置更新時になめらかに移動させる */
  }
  .shinkansen-inner{
    position: relative;
    width: 22px;
    height: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .shinkansen-icon svg{
    filter: drop-shadow(0 0 3px rgba(0,0,0,0.6));
    display: block;
  }
  .shinkansen-inner.running::before{
    content: "";
    position: absolute;
    inset: -6px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,176,32,0.35) 0%, rgba(255,176,32,0) 70%);
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{
    0%, 100%{ transform: scale(0.9); opacity: 0.6; }
    50%{ transform: scale(1.25); opacity: 1; }
  }

  .shinkansen-inner.special::before{
    content: "";
    position: absolute;
    inset: -8px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,61,154,0.55) 0%, rgba(255,61,154,0) 70%);
    animation: sparkle 1.2s ease-in-out infinite;
  }
  @keyframes sparkle{
    0%, 100%{ transform: scale(0.95) rotate(0deg); opacity: 0.7; }
    50%{ transform: scale(1.3) rotate(15deg); opacity: 1; }
  }

  .leaflet-popup-content-wrapper{
    background: var(--panel-2);
    color: var(--text);
    border-radius: 8px;
  }
  .leaflet-popup-tip{ background: var(--panel-2); }
  .leaflet-popup-content{
    font-family: "Zen Kaku Gothic New", sans-serif;
    font-size: 13px;
  }
  .leaflet-popup-content b{
    font-family: "JetBrains Mono", monospace;
  }

  .legend{
    position: absolute;
    left: 24px;
    bottom: 24px;
    z-index: 500;
    background: rgba(11,18,32,0.88);
    border-radius: 10px;
    padding: 8px 14px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.25);
    max-width: calc(100vw - 48px);
  }

  .legend-header{
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    font-size: 12px;
    font-weight: 700;
    color: var(--text);
    cursor: pointer;
    user-select: none;
    padding: 2px 0;
  }

  .legend-toggle-icon{
    color: var(--text-muted);
    font-size: 10px;
  }

  .legend-body{
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .legend.collapsed .legend-body{
    display: none;
  }

  .legend.collapsed{
    padding-bottom: 8px;
  }

  .legend-item{
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--text);
    white-space: nowrap;
    cursor: pointer;
    user-select: none;
    padding: 2px 4px;
    border-radius: 4px;
    transition: opacity 0.15s ease, background 0.15s ease;
  }

  .legend-item:hover{
    background: rgba(255,255,255,0.08);
  }

  .legend-item.off{
    opacity: 0.35;
  }

  .legend-item.off .legend-dot{
    background: var(--text-muted) !important;
  }

  .legend-dot{
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .legend-caption{
    font-size: 10px;
    color: var(--text-muted);
    letter-spacing: 0.04em;
    margin-bottom: 2px;
  }

  .legend-actions{
    display: flex;
    gap: 6px;
    margin-bottom: 4px;
  }

  .legend-action-btn{
    font-family: "Zen Kaku Gothic New", sans-serif;
    font-size: 10px;
    color: var(--text);
    background: rgba(255,255,255,0.08);
    border: none;
    border-radius: 4px;
    padding: 3px 8px;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  .legend-action-btn:hover{
    background: rgba(255,255,255,0.18);
  }

  @media (max-width: 720px){
    .app{ grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    .panel{ border-right: none; border-bottom: 1px solid var(--line); max-height: 40vh; }
    .map-wrap{ height: 60vh; }
  }
</style>
</head>
<body>

<div class="app">

  <div class="panel">
    <div class="panel-header">
      <div class="eyebrow">Live Train Map</div>
      <h1>新幹線ライブマップ</h1>
      <div class="sub">東海道・山陽・九州新幹線 運行状況</div>
    </div>

    <div class="status-row">
      <span>現在時刻(JST)</span>
      <span class="clock" id="clock">--:--:--</span>
    </div>
    <div class="status-row">
      <span>最終更新</span>
      <span class="clock" id="lastUpdated">--:--:--</span>
    </div>

    <div class="train-list" id="trainList">
      <div class="empty-state">読み込み中…</div>
    </div>

    <div class="panel-footer">
      時刻表に基づく推定位置です。遅延・運休は反映されません。
    </div>
  </div>

  <div class="map-wrap">
    <div id="map"></div>
    <div id="legend" class="legend"></div>
  </div>

</div>

<script>
// ---------------------------------------------------------------------
// 設定
// ---------------------------------------------------------------------
const DATA_URLS = {
  stations: "data/stations.json",
  positions: "data/train_positions.json",
};

// このデモ環境用のフォールバック(fetchが使えない/データが無い場合のサンプル)
const FALLBACK_STATIONS = null; // 実運用では data/stations.json を必ずfetchする
const FALLBACK_POSITIONS = null;

let map, stationLayer, trainLayer, stationsByName = {}, trainMarkers = {};
let hiddenTypes = new Set(); // 凡例クリックで非表示にした種別
let lastPositionsData = null; // フィルタ切り替え時に再取得なしで再描画するため

// ---------------------------------------------------------------------
// 地図初期化
// ---------------------------------------------------------------------
function initMap(){
  map = L.map('map', {
    zoomControl: false,
    attributionControl: true,
  }).setView([34.9, 135.0], 6);

  L.control.zoom({ position: 'bottomright' }).addTo(map);

  // 明るいベースマップ(CARTO Positron)
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; OpenStreetMap &copy; CARTO',
    subdomains: 'abcd',
    maxZoom: 19,
  }).addTo(map);

  stationLayer = L.layerGroup().addTo(map);
  trainLayer = L.layerGroup().addTo(map);
}

// ---------------------------------------------------------------------
// 駅・路線の描画
// ---------------------------------------------------------------------
function renderStations(stationsData){
  const stations = stationsData.stations;
  stationsByName = {};
  stations.forEach(s => stationsByName[s.name] = s);

  // 路線(直線でつなぐ簡易版。将来は実際の線路形状GeoJSONに差し替え可能)
  const latlngs = stations.sort((a,b)=>a.order-b.order).map(s => [s.lat, s.lng]);
  L.polyline(latlngs, {
    color: '#3B6BFF',
    weight: 2,
    opacity: 0.5,
  }).addTo(stationLayer);

  stations.forEach(s => {
    const isMajor = s.stops.includes('nozomi') || s.stops.includes('mizuho');
    const marker = L.circleMarker([s.lat, s.lng], {
      radius: isMajor ? 4 : 2.5,
      className: 'station-dot' + (isMajor ? ' major' : ''),
      color: isMajor ? '#0B1220' : '#5A6578',
      fillColor: isMajor ? '#0B1220' : '#5A6578',
      fillOpacity: 0.9,
      weight: 0,
    }).addTo(stationLayer);

    if(isMajor){
      marker.bindTooltip(s.name, {
        permanent: true,
        direction: 'top',
        className: 'station-label',
        offset: [0, -6],
      });
    }
    marker.bindPopup(`<b>${s.name}</b> / ${s.name_en}`);
  });
}

// ---------------------------------------------------------------------
// 新幹線アイコン (SVG divIcon)
// ---------------------------------------------------------------------
const TRAIN_TYPE_COLORS = {
  nozomi: '#E8384F',   // 赤系
  hikari: '#F5A623',   // 橙系
  kodama: '#3B6BFF',   // 青系(既存アクセントカラー)
  mizuho: '#B23BD8',   // 紫系(山陽・九州直通の速達型)
  sakura: '#2FBF71',   // 緑系
  tsubame: '#3BC9DB',  // 水色系
  other: '#8A94A6',    // その他(回送・団体等)
};
const TRAIN_TYPE_LABELS = {
  nozomi: 'のぞみ', hikari: 'ひかり', kodama: 'こだま',
  mizuho: 'みずほ', sakura: 'さくら', tsubame: 'つばめ', other: 'その他',
};

function shinkansenIcon(trainType, status, bearing, isSpecial){
  const glowClass = status === 'running' ? 'running' : '';
  const rotation = bearing || 0;

  let svg;
  if(isSpecial){
    // Sparkling Dreams Shinkansen専用アイコン: ミッキーシルエット+スパークル
    svg = `
      <svg width="24" height="24" viewBox="0 0 24 24" style="transform: rotate(${rotation}deg); transform-origin: 50% 50%; transform-box: fill-box;">
        <defs>
          <linearGradient id="sdGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#3B6BFF"/>
            <stop offset="100%" stop-color="#8A5CFF"/>
          </linearGradient>
        </defs>
        <circle cx="12" cy="14.5" r="7.2" fill="url(#sdGrad)" stroke="#FFD700" stroke-width="0.8"/>
        <circle cx="5.6" cy="6.6" r="4" fill="url(#sdGrad)" stroke="#FFD700" stroke-width="0.6"/>
        <circle cx="18.4" cy="6.6" r="4" fill="url(#sdGrad)" stroke="#FFD700" stroke-width="0.6"/>
        <path d="M12 10.7 L12.8 13.1 L15.2 13.1 L13.2 14.5 L14 16.9 L12 15.5 L10 16.9 L10.8 14.5 L8.8 13.1 L11.2 13.1 Z"
              fill="#FFD700"/>
      </svg>`;
  } else {
    const color = TRAIN_TYPE_COLORS[trainType] || TRAIN_TYPE_COLORS.other;
    svg = `
      <svg width="22" height="22" viewBox="0 0 22 22" style="transform: rotate(${rotation}deg); transform-origin: 50% 50%; transform-box: fill-box;">
        <path d="M11 1 C 15 3, 18 8, 18 12 L 18 18 C 18 19.5, 16.8 20.5, 15 20.5 L 7 20.5 C 5.2 20.5, 4 19.5, 4 18 L 4 12 C 4 8, 7 3, 11 1 Z"
              fill="${color}" stroke="#0B1220" stroke-width="0.8"/>
        <circle cx="11" cy="7" r="1.4" fill="#FFFFFF" opacity="0.9"/>
      </svg>`;
  }

  const html = `<div class="shinkansen-inner ${glowClass} ${isSpecial ? 'special' : ''}">${svg}</div>`;

  return L.divIcon({
    className: `shinkansen-icon`,
    html: html,
    iconSize: [34, 34],
    iconAnchor: [17, 17],
  });
}

function bearingBetween(a, b){
  const toRad = d => d * Math.PI / 180;
  const toDeg = r => r * 180 / Math.PI;
  const dLng = toRad(b.lng - a.lng);
  const y = Math.sin(dLng) * Math.cos(toRad(b.lat));
  const x = Math.cos(toRad(a.lat)) * Math.sin(toRad(b.lat)) -
            Math.sin(toRad(a.lat)) * Math.cos(toRad(b.lat)) * Math.cos(dLng);
  return (toDeg(Math.atan2(y, x)) + 360) % 360;
}

// ---------------------------------------------------------------------
// 列車マーカーの描画・更新
// ---------------------------------------------------------------------
function renderTrains(positionsData){
  lastPositionsData = positionsData;
  const allTrains = positionsData.trains || [];
  const trains = allTrains.filter(t => !hiddenTypes.has(t.train_type || 'other'));
  const seen = new Set();

  updateLastUpdatedLabel(positionsData.updated_at);

  trains.forEach(t => {
    seen.add(t.trip_id);
    const [fromName, toName] = (t.current_segment || '').split('→');
    const from = stationsByName[fromName];
    const to = stationsByName[toName];
    const bearing = (from && to) ? bearingBetween(from, to) : 0;

    const icon = shinkansenIcon(t.train_type || 'other', t.status, bearing, !!t.is_special);

    if(trainMarkers[t.trip_id]){
      trainMarkers[t.trip_id].setLatLng([t.lat, t.lng]);
      trainMarkers[t.trip_id].setIcon(icon);
    } else {
      const marker = L.marker([t.lat, t.lng], { icon }).addTo(trainLayer);
      marker.bindPopup(popupHtml(t));
      trainMarkers[t.trip_id] = marker;
    }
    trainMarkers[t.trip_id].setPopupContent(popupHtml(t));
  });

  // 運行終了した列車のマーカーを削除
  Object.keys(trainMarkers).forEach(id => {
    if(!seen.has(id)){
      trainLayer.removeLayer(trainMarkers[id]);
      delete trainMarkers[id];
    }
  });

  renderTrainList(trains);
}

function popupHtml(t){
  const specialLine = t.is_special ? `<br>✨ Sparkling Dreams Shinkansen` : '';
  return `<b>${t.train_number}</b>${specialLine}<br>${t.current_segment}<br>${t.status === 'running' ? '走行中' : '停車中'}`;
}

function renderTrainList(trains){
  const list = document.getElementById('trainList');
  if(trains.length === 0){
    list.innerHTML = `<div class="empty-state">現在運行中の列車はありません</div>`;
    return;
  }

  list.innerHTML = trains.map(t => `
    <div class="train-card ${t.is_special ? 'special' : ''}" data-id="${t.trip_id}">
      <div class="train-card-top">
        <span class="train-number">
          <span class="type-dot" style="background:${TRAIN_TYPE_COLORS[t.train_type] || TRAIN_TYPE_COLORS.other}"></span>
          ${t.train_number}
          ${t.is_special ? '<span class="special-badge">✨ Disney</span>' : ''}
        </span>
        <span class="badge ${t.status}">${t.status === 'running' ? 'LIVE' : 'STOP'}</span>
      </div>
      <div class="train-segment">${t.current_segment}</div>
    </div>
  `).join('');

  document.querySelectorAll('.train-card').forEach(card => {
    card.addEventListener('click', () => {
      const id = card.dataset.id;
      const marker = trainMarkers[id];
      if(marker){
        focusOnLatLng(marker.getLatLng(), 9);
        marker.openPopup();
      }
      document.querySelectorAll('.train-card').forEach(c => c.classList.remove('active'));
      card.classList.add('active');
    });
  });
}

// サイドパネル(幅360px、モバイルでは上段)の分だけ地図コンテナの中心と
// 画面全体の中心がズレるため、そのズレを補正してから中央寄せする
function focusOnLatLng(latlng, zoom){
  const isDesktop = window.innerWidth > 720;
  const sidebarOffsetPx = isDesktop ? 180 : 0; // サイドパネル幅360pxの半分
  if(sidebarOffsetPx === 0){
    map.setView(latlng, zoom, { animate: true });
    return;
  }
  const targetPoint = map.project(latlng, zoom).add([sidebarOffsetPx, 0]);
  const adjustedLatLng = map.unproject(targetPoint, zoom);
  map.setView(adjustedLatLng, zoom, { animate: true });
}

// ---------------------------------------------------------------------
// 最終更新表示
// ---------------------------------------------------------------------
function updateLastUpdatedLabel(isoString){
  const el = document.getElementById('lastUpdated');
  if (!isoString) {
    el.textContent = '--:--:--';
    return;
  }
  const d = new Date(isoString);
  const jst = new Date(d.toLocaleString('en-US', { timeZone: 'Asia/Tokyo' }));
  const hh = String(jst.getHours()).padStart(2,'0');
  const mm = String(jst.getMinutes()).padStart(2,'0');
  const ss = String(jst.getSeconds()).padStart(2,'0');
  el.textContent = `${hh}:${mm}:${ss}`;

  // 更新があったことが一目でわかるよう、一瞬ハイライトさせる
  el.style.color = 'var(--live)';
  setTimeout(() => { el.style.color = ''; }, 800);
}

// ---------------------------------------------------------------------
// 凡例
// ---------------------------------------------------------------------
function renderLegend(){
  const order = ['nozomi', 'hikari', 'kodama', 'mizuho', 'sakura', 'tsubame', 'other'];
  const el = document.getElementById('legend');

  const isMobile = window.innerWidth <= 720;
  if(el.dataset.initialized !== 'true'){
    if(isMobile) el.classList.add('collapsed');
    el.dataset.initialized = 'true';
  }

  el.innerHTML = `
    <div class="legend-header" id="legendHeader">
      <span>凡例</span>
      <span class="legend-toggle-icon">${el.classList.contains('collapsed') ? '▸' : '▾'}</span>
    </div>
    <div class="legend-body">
      <div class="legend-caption">タップで表示/非表示</div>
      <div class="legend-actions">
        <button type="button" class="legend-action-btn" data-action="show-all">すべて表示</button>
        <button type="button" class="legend-action-btn" data-action="hide-all">すべて非表示</button>
      </div>
      ${order.map(key => `
        <div class="legend-item ${hiddenTypes.has(key) ? 'off' : ''}" data-type="${key}">
          <span class="legend-dot" style="background:${TRAIN_TYPE_COLORS[key]}"></span>
          <span>${TRAIN_TYPE_LABELS[key]}</span>
        </div>
      `).join('')}
    </div>
  `;

  el.querySelector('#legendHeader').addEventListener('click', () => {
    el.classList.toggle('collapsed');
    el.querySelector('.legend-toggle-icon').textContent = el.classList.contains('collapsed') ? '▸' : '▾';
  });

  el.querySelector('[data-action="show-all"]').addEventListener('click', (e) => {
    e.stopPropagation();
    hiddenTypes.clear();
    renderLegend();
    if(lastPositionsData) renderTrains(lastPositionsData);
  });
  el.querySelector('[data-action="hide-all"]').addEventListener('click', (e) => {
    e.stopPropagation();
    order.forEach(key => hiddenTypes.add(key));
    renderLegend();
    if(lastPositionsData) renderTrains(lastPositionsData);
  });

  el.querySelectorAll('.legend-item').forEach(item => {
    item.addEventListener('click', () => {
      const type = item.dataset.type;
      if(hiddenTypes.has(type)){
        hiddenTypes.delete(type);
      } else {
        hiddenTypes.add(type);
      }
      item.classList.toggle('off');
      if(lastPositionsData) renderTrains(lastPositionsData);
    });
  });
}

// ---------------------------------------------------------------------
// 時計
// ---------------------------------------------------------------------
function updateClock(){
  const now = new Date();
  const jst = new Date(now.toLocaleString('en-US', { timeZone: 'Asia/Tokyo' }));
  const hh = String(jst.getHours()).padStart(2,'0');
  const mm = String(jst.getMinutes()).padStart(2,'0');
  const ss = String(jst.getSeconds()).padStart(2,'0');
  document.getElementById('clock').textContent = `${hh}:${mm}:${ss}`;
}

// ---------------------------------------------------------------------
// データ取得・更新ループ
// ---------------------------------------------------------------------
async function loadStations(){
  try{
    const res = await fetch(DATA_URLS.stations);
    const data = await res.json();
    renderStations(data);
  } catch(e){
    console.error('stations.json の取得に失敗しました', e);
    document.getElementById('trainList').innerHTML =
      `<div class="empty-state">stations.json を読み込めませんでした。<br>data/stations.json の配置を確認してください。</div>`;
  }
}

async function loadPositions(){
  try{
    const res = await fetch(`${DATA_URLS.positions}?t=${Date.now()}`, { cache: 'no-store' });
    const data = await res.json();
    renderTrains(data);
  } catch(e){
    console.error('train_positions.json の取得に失敗しました', e);
  }
}

async function init(){
  initMap();
  renderLegend();
  await loadStations();
  await loadPositions();
  updateClock();
  setInterval(updateClock, 1000);
  setInterval(loadPositions, 30 * 1000); // 30秒おきに位置を再取得

  // --- レイアウト確定後にLeafletへサイズ再計算を促す ---
  // CSS Gridのレイアウト確定やWebフォント読み込みのタイミングによって
  // 地図コンテナの実サイズが初期化時と食い違うと、タイル・マーカー・
  // ラベルの位置ズレや描画のにじみが発生するため、複数のタイミングで補正する。
  requestAnimationFrame(() => map.invalidateSize());
  setTimeout(() => map.invalidateSize(), 300);

  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(() => map.invalidateSize());
  }

  window.addEventListener('resize', () => map.invalidateSize());
}

init();
</script>
