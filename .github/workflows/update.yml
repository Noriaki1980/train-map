name: Update train positions

on:
  schedule:
    # 5分おきに実行 (GitHub Actionsのcronは負荷状況により多少遅延することがある)
    - cron: "*/5 * * * *"
  workflow_dispatch: {}  # 手動実行用ボタンも有効化しておく

permissions:
  contents: write

jobs:
  update-positions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run scraper
        run: python scraper.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/train_positions.json
          if git diff --cached --quiet; then
            echo "変更なし。コミットをスキップします。"
            exit 0
          fi
          git commit -m "chore: update train positions [skip ci]"

          # 同時実行によるpush競合(fetch first)に備えて、
          # 失敗したら最新を取り込んで最大5回までリトライする
          for i in 1 2 3 4 5; do
            if git push; then
              echo "push成功(${i}回目)"
              exit 0
            fi
            echo "push失敗(${i}回目)。最新を取り込んでリトライします..."
            git pull --rebase origin main
            sleep $((RANDOM % 5 + 1))
          done

          echo "5回試しても push できませんでした"
          exit 1
